<body>

<header>
    <div class="nav_bar">
        <nav>
            <ul>
                <li> <a href="index.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li class="theme-icons">
                    <button id="lightModeBtn" class="theme-icon-btn" type="button" aria-label="Light mode">
                        <span class="theme-icon theme-icon-sun"></span>
                    </button>
                    <button id="darkModeBtn" class="theme-icon-btn" type="button" aria-label="Dark mode">
                        <span class="theme-icon theme-icon-moon"></span>
                    </button>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <section class="contact">
        <h1>Contact</h1>
        <p>
            Feel free to reach out if you have any questions, collaboration ideas, or just want to <br>
            chat about UX design and creativity.
        </p>
    </section>

    

    <section>
        <form id="contactForm" action="" method="post" novalidate>
            
            <p class="form-note">* Required fields</p>

            <label for="firstName">First Name *</label>
            <input id="firstName" name="firstName" type="text" required 
            pattern="[A-Za-zÀ-ÖØ-öø-ÿ\s]+"
            title="First name must contain only letters">
            <p class="error-message"></p>
                
            <label for="lastName">Last Name *</label>
            <input id="lastName" name="lastName" type="text" required
            pattern="[A-Za-zÀ-ÖØ-öø-ÿ\s]+" title="First name must contain only letters">
            <p class="error-message"></p>

            <label for="email">Email *</label>
            <input id="email" name="email" type="email" required>
            <p class="error-message"></p>

            <label for="phone">Phone Number</label>
            <input id="phone" name="phoneNumber" type="tel"
            inputmode="numeric"
            pattern="^\+?[0-9]+$"
            title="Use numbers only, optionally starting with +">
            <p class="error-message"></p>

            <label class="option_field">Subject *</label>
                <select id="subject" name="subject" required>
                    <option value="" disabled selected>--Please choose a subject--</option>
                    <option value="general">General Contact</option>
                    <option value="collaboration">Collaboration</option>
                    <option value="feedback">Feedback</option>
                </select>
                <p class="error-message"></p>

            <label for="message">Message *</label>
            <textarea id="message" name="message" minlength="20" required></textarea>

            <p class="error-message"></p>
            <p id="messageCounter" class="char-counter">0 / 20 characters</p>
            
            <button type="submit" class="submitButton">Submit</button>
            <button type="reset" class="clearButton">Clear</button>
            <p id="successMessage" class="success-message"></p>
        </form>
    </section>
</main>
